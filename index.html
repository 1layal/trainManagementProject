
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Delete the Reservation </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; min-width: 400px; text-align: right; }
        
        .search-section { background: #ebf5fb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 8px; width: 60%; border: 1px solid #ccc; border-radius: 4px; }
        button.search-btn { padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .result-area { margin-top: 20px; padding: 15px; border: 2px dashed #3498db; display: none; } 
        
        .delete-btn { background-color: #18100f; color: rgb(34, 23, 77); border: none; padding: 7px 15px; border-radius: 5px; cursor: pointer; }
        .counter { margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2> Delete the Reservation </h2>
        
        <div class="counter"> Available seats <span id="seat-count">10</span></div>

        <div class="search-section">
            <label>Enter the booking number: </label>
            <input type="text" id="searchInput" placeholder="EX: 101">
            <button class="search-btn" onclick="searchReservation()">Search</button>
        </div>

        <div id="resultArea" class="result-area">
            <h4> The booking was found: </h4>
            <p id="reservationDetail"></p>
            <div id="actionButton"></div>
        </div>

        <p id="errorMsg" style="color: rgb(41, 28, 28); display: none;"> No reservation available with this number </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
