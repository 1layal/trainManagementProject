<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Train Dashboard</title>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
 * { box-sizing: border-box; }
 :root { --primary: #2c3e50; --accent: #8e44ad; --bg: #f4f7f6; }
 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background: var(--bg);
 margin: 0;
 padding: 20px;
 }
 .container { max-width: 1200px; margin: 0 auto; }
 .card {
 background: white;
 border-radius: 15px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.1);
 padding: 25px;
 margin-bottom: 25px;
 border-top: 8px solid var(--accent);
 }
 h2, h3 { color: var(--primary); margin-top: 0; }
 .dashboard-grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
 gap: 20px;
 margin: 20px 0;
 }
 .metric-card {
 background: #f8f9fa;
 border-radius: 10px;
 padding: 20px;
 text-align: center;
 box-shadow: 0 2px 5px rgba(0,0,0,0.05);
 }
 .metric-value { font-size: 2.2em; font-weight: bold; color: var(--primary); }
 .metric-label { color: #666; margin-top: 8px; }
 select, button {
 padding: 10px 15px;
 border-radius: 8px;
 border: 1px solid #ddd;
 font-size: 1rem;
 }
 button {
 background: var(--primary);
 color: white;
 border: none;
 cursor: pointer;
 }
 button:hover { background: #1e2b36; }
 .btn-accent { background: var(--accent); }
 .btn-accent:hover { background: #6c3483; }
 table { width: 100%; border-collapse: collapse; margin-top: 15px; }
 th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
 th { background: var(--primary); color: white; }
 .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
 .action-buttons a {
 background: var(--primary);
 color: white;
 padding: 8px 15px;
 text-decoration: none;
 border-radius: 8px;
 }
 .admin-only { display: none; }
 .error { color: red; text-align: center; }
 </style>
</head>
<body>
<div class="container">
 <div class="card">
 <h2>Train Reservation Dashboard <span id="roleBadge" style="font-size:0.6em; background:var(--accent); padding:5px 10px;
border-radius:20px;"></span></h2>
 <div id="userInfo"></div>
 <div class="action-buttons">
 <a href="add_train.html">Add Train</a>
 <a href="manage_trains.html">Manage Trains</a>
 <a href="add_passenger.html">Add Passenger</a>
 <a href="book_ticket.html">Book Ticket</a>
 <a href="search_passenger.html">Search Passenger</a>
 <button id="logoutBtn" class="btn-accent">Logout</button>
 </div>
 </div>
 <!-- KPI Section -->
 <div class="card">
 <h3>Key Performance Indicators</h3>
 <div id="kpiGrid" class="dashboard-grid">
 <div class="metric-card"><div class="metric-value">Loading...</div><div class="metric-label">Please wait</div></div>
 </div>
 </div>
 <!-- Periodic Booking Reports (Admin only) -->
 <div id="reportsCard" class="card admin-only">
 <h3>Periodic Booking Reports</h3>
 <div class="form-group">
 <label>Period</label>
 <select id="reportPeriod">
 <option value="day">Daily (today)</option>
 <option value="week">Weekly (last 7 days)</option>
 <option value="month">Monthly (last 30 days)</option>
 </select>
 <button id="generateReportBtn">Generate Report</button>
 </div>
 <div id="reportResult"></div>
 </div>
</div>
<script>
 // ========== 1. Supabase Client (MUST be correct) ==========
             const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

 let currentUserRole = 'staff';
 // ========== 2. Check Authentication ==========
 (async () => {
 const { data: { session }, error } = await supabaseClient.auth.getSession();
 if (error || !session) {
 window.location.href = 'login.html';
 return;
 }
 currentUserRole = session.user.user_metadata?.role || 'staff';
 document.getElementById('roleBadge').innerText = currentUserRole.toUpperCase();
 document.getElementById('userInfo').innerHTML = `Logged in as: ${session.user.email} (${currentUserRole})`;
 if (currentUserRole === 'admin') {
 document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
 document.getElementById('generateReportBtn').addEventListener('click', generateReport);
 }
 await loadKPIs();
 })();
 // ========== 3. KPI Function (using your actual column names) ==========
 async function loadKPIs() {
 try {
 // Count trains (table 'trains'? You said columns: ID, name, number, capacity)
 // Assuming table name is 'trains' (lowercase). Change if different.
 const { count: trainCount, error: err1 } = await supabaseClient
 .from('trains')
 .select('*', { count: 'exact', head: true });
 if (err1) throw new Error(`Trains: ${err1.message}`);
 // Count passengers (table 'passengers' with columns: passenger_ID, name, phone, email)
 const { count: passengerCount, error: err2 } = await supabaseClient.from('passengers')
 .select('*', { count: 'exact', head: true });
 if (err2) throw new Error(`Passengers: ${err2.message}`);
 // Count bookings (table 'Booking' with columns: ID_booking, name, booking_date, train_ID, schedule_ID, passenger_ID,ticket_price)
 const { count: bookingCount, error: err3 } = await supabaseClient.from('Booking').select('*', { count: 'exact', head: true });
 if (err3) throw new Error(`Bookings: ${err3.message}`);
 // Total revenue (sum of ticket_price from Booking)
 const { data: bookings, error: err4 } = await supabaseClient
 .from('Booking')
 .select('ticket_price');
 if (err4) throw new Error(`Revenue: ${err4.message}`);
 const totalRevenue = bookings?.reduce((sum, b) => sum + (b.ticket_price || 0), 0) || 0;
 // Occupancy rate (requires trains.capacity and maybe a way to count booked seats)
 // Since you have booking table with train_ID, we can count bookings per train
 // But easier: get total capacity from trains and total bookings (each booking = 1 seat)
 const { data: trains, error: err5 } = await supabaseClient.from('trains').select('capacity');
 if (err5) throw new Error(`Occupancy: ${err5.message}`);
 const totalCapacity = trains?.reduce((sum, t) => sum + (t.capacity || 0), 0) || 0;
 const occupancyRate = totalCapacity ? ((bookingCount / totalCapacity) * 100).toFixed(1) : 0;
 const kpiHtml = `
 <div class="metric-card"><div class="metric-value">${trainCount ?? 0}</div><div class="metric-label"> Trains</div></div>
 <div class="metric-card"><div class="metric-value">${passengerCount ?? 0}</div><div class="metric-label">
Passengers</div></div>
 <div class="metric-card"><div class="metric-value">${bookingCount ?? 0}</div><div class="metric-label">
Bookings</div></div>
 <div class="metric-card"><div class="metric-value">$${totalRevenue.toFixed(2)}</div><div class="metric-label">
Revenue</div></div>
 <div class="metric-card"><div class="metric-value">${occupancyRate}%</div><div class="metric-label">
Occupancy</div></div>
 `;
 document.getElementById('kpiGrid').innerHTML = kpiHtml;
 } catch (err) {
 console.error(err);
 document.getElementById('kpiGrid').innerHTML = `<div class="error">Failed to load KPIs: ${err.message}</div>`;
 }
 }
 // ========== 4. Periodic Booking Reports ==========
 async function generateReport() {
 const period = document.getElementById('reportPeriod').value;
 let startDate;
 const now = new Date();
 if (period === 'day') {
 startDate = new Date(now.setHours(0,0,0,0)).toISOString();
 } else if (period === 'week') {
 startDate = new Date(now.setDate(now.getDate() - 7)).toISOString();
 } else {
 startDate = new Date(now.setDate(now.getDate() - 30)).toISOString();
 }
 // Query Booking table with passenger and train details
 const { data: bookings, error } = await supabaseClient.from('Booking').select(`
 ID_booking,
 name,
 booking_date,
 ticket_price,
 train_ID,
 passenger_ID,
 trains:train_ID (name, number),
 passengers:passenger_ID (name, phone, email)
 `)
 .gte('booking_date', startDate);
 if (error) {
 alert('Error loading reports: ' + error.message);
 return;
 }
 if (!bookings || bookings.length === 0) {
 document.getElementById('reportResult').innerHTML = '<p>No bookings in this period.</p>';
 return;
 }
 let totalRevenue = 0;
 let html = `<table><thead><tr><th>ID</th><th>Passenger
Name</th><th>Train</th><th>Date</th><th>Price</th></tr></thead><tbody>`;
 bookings.forEach(b => {
 totalRevenue += b.ticket_price || 0;
 const passengerName = b.passengers ? b.passengers.name : (b.name || 'N/A');
 const trainName = b.trains ? b.trains.name : `Train ${b.train_ID}`;
 html += `<tr>
 <td>${b.ID_booking}</td>
 <td>${passengerName}</td>
 <td>${trainName}</td>
 <td>${new Date(b.booking_date).toLocaleDateString()}</td>
 <td>$${b.ticket_price?.toFixed(2) || '0.00'}</td>
 </tr>`;
 });
 html += `</tbody><tfoot><tr><td colspan="4"><strong>Total
Revenue</strong></td><td><strong>$${totalRevenue.toFixed(2)}</strong></td></tr></tfoot>`;
 document.getElementById('reportResult').innerHTML = html;
 }
 // ========== 5. Logout ==========
 document.getElementById('logoutBtn').addEventListener('click', async () => {
 await supabaseClient.auth.signOut();
 window.location.href = 'login.html';
 });
</script>
</body>
</html>
