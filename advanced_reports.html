<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1250px; margin: auto; background: white; padding: 30px; border-radius: 15px; border-top: 10px solid #965AAA; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .filters { display: flex; gap: 15px; background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 25px; align-items: flex-end; flex-wrap: wrap; }
        .f-item { display: flex; flex-direction: column; flex: 1; min-width: 160px; }
        label { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: #475569; }
        input, select, button { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; }
        .btn-gen { background: #341d3c; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-gen:hover { background: #341d3c; }

        .export-section { display: none; justify-content: flex-end; gap: 12px; margin-bottom: 15px; }
        .btn-export { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 0.9rem; }
        .excel { background: #10b981; } .pdf { background: #e11d48; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; background: white; }
        th { background: #f8fafc; color: #965AAA; padding: 15px; border-bottom: 3px solid #e2e8f0; text-align: center; font-size: 0.85rem; }
        td { padding: 15px; text-align: center; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .occ-text { font-weight: bold; }
        .class-breakdown { font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="color: #1e293b; margin-bottom: 5px;">Advanced Report </h1>
        <p style="color: #64748b;">Comprehensive reporting on occupancy and detailed bookings</p>
    </div>

    <div class="filters">
        <div class="f-item">
            <label>Train ID (Optional)</label>
            <input type="number" id="trainInput" placeholder="All Trains">
        </div>
        <div class="f-item">
            <label>Period</label>
            <select id="periodInput">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div class="f-item">
            <label>Start Date</label>
            <input type="date" id="dateInput">
        </div>
        <button class="btn-gen" onclick="generateAnalytics()">Generate Analytics</button>
    </div>

    <div class="export-section" id="exportArea">
        <button class="btn-export excel" onclick="exportToExcel()">Download Excel</button>
        <button class="btn-export pdf" onclick="exportToPDF()">Download PDF</button>
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Train ID</th>
                <th>Departure Time</th>
                <th>Route Name</th>
                <th>Capacity</th>
                <th>Booked Details</th>
                <th>Total Booked</th>
                <th>Remaining</th>
                <th>Occupancy %</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const SUPA_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const SUPA_KEY = 'sb_publishable_gjT_j3Mc-ZsOInmLNHtl2A_jTWW3W7s'; 
    const client = supabase.createClient(SUPA_URL, SUPA_KEY);

    async function generateAnalytics() {
        const tid = document.getElementById('trainInput').value;
        const sDate = document.getElementById('dateInput').value;
        const period = document.getElementById('periodInput').value;

        if (!sDate) return alert("Please select a date first.");

        try {
            let start = new Date(sDate);
            let end = new Date(sDate);
            if (period === 'daily') end.setDate(end.getDate() + 1);
            else if (period === 'weekly') end.setDate(end.getDate() + 7);
            else end.setMonth(end.getMonth() + 1);

            let query = client
                .from('schedules')
                .select('id, route_name, departure_time, train_id, trains(capacity)')
                .gte('departure_time', start.toISOString())
                .lt('departure_time', end.toISOString());

            if (tid) query = query.eq('train_id', tid);

            const { data: schedules, error: sErr } = await query;
            if (sErr) throw sErr;
            const { data: bookings, error: bErr } = await client.from('Booking').select('schedule_id, ticket_type');
            if (bErr) throw bErr;

            processAndRender(schedules, bookings);
        } catch (err) {
            console.error(err);
            alert("Fetch Error: " + err.message);
        }
    }

    function processAndRender(schedules, bookings) {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";

        if (schedules.length === 0) {
            alert("No trips found for the selected period.");
            return;
        }

        schedules.forEach(s => {
            const cap = s.trains ? s.trains.capacity : 0;
            
          
            const tripBookings = bookings.filter(b => b.schedule_id === s.id);
            const eco = tripBookings.filter(b => b.ticket_type === 'Economy').length;
            const biz = tripBookings.filter(b => b.ticket_type === 'Business').length;
            const first = tripBookings.filter(b => b.ticket_type === 'First Class').length;

            const bookedCount = tripBookings.length;
            const remain = cap - bookedCount;
            const occupancy = cap > 0 ? Math.round((bookedCount / cap) * 100) : 0;
            
            let color = occupancy > 80 ? "#e11d48" : (occupancy > 40 ? "#f59e0b" : "#10b981");

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${s.train_id}</td>
                <td>${new Date(s.departure_time).toLocaleString()}</td>
                <td><strong>${s.route_name}</strong></td>
                <td>${cap}</td>
                <td>
                    <span class="class-breakdown">Eco: ${eco} | Biz: ${biz} | First: ${first}</span>
                </td>
                <td style="color:#9139f1; font-weight:bold;">${bookedCount}</td>
                <td>${remain}</td>
                <td class="occ-text" style="color:${color}">${occupancy}%</td>
            `;
            body.appendChild(tr);
        });

        document.getElementById('resultsTable').style.display = "table";
        document.getElementById('exportArea').style.display = "flex";
    }

    function exportToExcel() {
        const table = document.getElementById('resultsTable');
        const wb = XLSX.utils.table_to_book(table, { sheet: "Train Analytics" });
        XLSX.writeFile(wb, "Advanced_Report.xlsx");
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();

        doc.setFontSize(22);
        doc.setTextColor(5, 10, 25);
        doc.text("Advanced Report ", pageWidth / 2, 20, { align: 'center' });
        doc.setDrawColor(150, 90, 170); 
        doc.setLineWidth(1); 
        doc.line(20, 25, pageWidth - 20, 25); 
        doc.autoTable({
            html: '#resultsTable',
            startY: 32,
            theme: 'grid',
            headStyles: { fillColor: [48, 0, 72], halign: 'center' },
            styles: { halign: 'center', fontSize: 9 }
        });

        doc.save("Advanced_Report.pdf");
    }
</script>
</body>
</html>
