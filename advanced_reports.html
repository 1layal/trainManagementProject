<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analytics Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; margin: 0; padding: 40px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; border-top: 10px solid #9139f1; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; text-align: center; }
        
        /* الفلاتر */
        .filter-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .field { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #475569; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; }
        
        .btn-main { background: #471b73; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-main:hover { background: #471b73; }

        /* العدادات */
        .stats-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { padding: 20px; border-radius: 15px; text-align: center; color: white; }
        .eco { background: #280f55; } .biz { background: #25215e; } .first { background: #311b48; }
        .stat-card h3 { margin: 0; font-size: 1rem; opacity: 0.9; }
        .stat-card p { font-size: 2rem; margin: 10px 0; font-weight: bold; }

        /* أزرار التحميل */
        .export-buttons { display: none; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
        .btn-export { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .pdf-bg { background: #ef4444; color: white; }
        .excel-bg { background: #10b981; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; }
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; background: #f3e8ff; color: #9139f1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Advanced Analytics & Seat Reports</h2>

    <div class="filter-section">
        <div class="field">
            <label>Train ID (Optional)</label>
            <input type="number" id="trainId" placeholder="All Trains">
        </div>
        <div class="field">
            <label>Period</label>
            <select id="period">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
        </div>
        <div class="field">
            <label>Start Date</label>
            <input type="date" id="startDate">
        </div>
        <button class="btn-main" onclick="fetchAdvancedData()">Generate Report</button>
    </div>

    <div class="stats-grid" id="statsArea">
        <div class="stat-card eco"><h3>Economy Class</h3><p id="ecoVal">0</p></div>
        <div class="stat-card biz"><h3>Business Class</h3><p id="bizVal">0</p></div>
        <div class="stat-card first"><h3>First Class</h3><p id="firstVal">0</p></div>
    </div>

    <div class="export-buttons" id="exportArea">
        <button class="btn-export pdf-bg" onclick="downloadPDF()">Download PDF</button>
        <button class="btn-export excel-bg" onclick="downloadExcel()">Download Excel</button>
    </div>

    <table id="reportTable">
        <thead>
            <tr>
                <th>Train ID</th>
                <th>Route & Class</th>
                <th>Departure Time</th>
                <th>Available Seats</th>
            </tr>
        </thead>
        <tbody id="reportContent"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const supabaseKey = 'sb_publishable_gjT_j3Mc-ZsOInmLNHtl2A_jTWW3W7s';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchAdvancedData() {
        const tid = document.getElementById('trainId').value;
        const p = document.getElementById('period').value;
        const sDate = document.getElementById('startDate').value;

        if(!sDate) return alert("Select a date!");

        let start = new Date(sDate);
        let end = new Date(sDate);
        if(p==='daily') end.setDate(end.getDate()+1);
        else if(p==='weekly') end.setDate(end.getDate()+7);
        else end.setMonth(end.getMonth()+1);

        const { data, error } = await _supabase
            .from('schedules')
            .select('*')
            .gte('departure_time', start.toISOString())
            .lt('departure_time', end.toISOString());

        if(error) return console.error(error);
        
        let filteredData = tid ? data.filter(x => x.train_id == tid) : data;
        renderReport(filteredData);
    }

    function renderReport(data) {
        const tbody = document.getElementById('reportContent');
        tbody.innerHTML = "";
        let counts = { economy: 0, business: 0, first: 0 };

        data.forEach(row => {
            const seats = row.available_seats || 0;
            const type = (row.ticket_type || "").toLowerCase();

            if(type.includes('eco')) counts.economy += seats;
            else if(type.includes('biz')) counts.business += seats;
            else if(type.includes('first')) counts.first += seats;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${row.train_id}</td>
                <td>${row.route_name} <br><small>(${row.ticket_type})</small></td>
                <td>${new Date(row.departure_time).toLocaleString()}</td>
                <td><span class="badge">${seats} Left</span></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('ecoVal').innerText = counts.economy;
        document.getElementById('bizVal').innerText = counts.business;
        document.getElementById('firstVal').innerText = counts.first;

        document.getElementById('statsArea').style.display = 'grid';
        document.getElementById('exportArea').style.display = 'flex';
        document.getElementById('reportTable').style.display = 'table';
    }

    // وظيفة تحميل Excel
    function downloadExcel() {
        const table = document.getElementById("reportTable");
        const wb = XLSX.utils.table_to_book(table, {sheet: "Train Report"});
        XLSX.writeFile(wb, "Train_Advanced_Report.xlsx");
    }

    // وظيفة تحميل PDF
    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Advanced Train Capacity Report", 14, 15);
        doc.autoTable({ html: '#reportTable', marginTop: 30 });
        doc.save("Train_Advanced_Report.pdf");
    }
</script>
</body>
</html>
