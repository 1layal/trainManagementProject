<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Travel Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .analytics-card { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
            border-top: 5px solid #8e44ad; 
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ddd; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-item { background: #fdfaff; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #efe5f5; }
        .stat-num { font-size: 1.5rem; font-weight: bold; color: #8e44ad; }
    </style>
</head>
<body>

<div class="analytics-card">
    <div class="header-flex">
        <h2 style="margin:0;">Trips & Cities Analytics</h2>
        <select id="cityFilter" onchange="updateView()">
            <option value="all">All Stations</option>
        </select>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <div>Total Bookings</div>
            <div id="totalBookings" class="stat-num">0</div>
        </div>
        <div class="stat-item">
            <div>Estimated Revenue</div>
            <div id="totalRev" class="stat-num">0 SAR</div>
        </div>
    </div>

    <canvas id="tripsChart" width="400" height="200"></canvas>
</div>

<script>
    const S_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    let myChart = null;
    let globalData = [];

    async function fetchData() {
        // جلب البيانات من الجداول
        const { data, error } = await _supabase
            .from('schedules')
            .select('to_station, Booking(ticket_price)');

        if (error) return;
        globalData = data;

        // 1. استخراج كل المدن الفريدة من الداتابيز لتعبئة الـ Filter
        const uniqueCities = [...new Set(data.map(item => item.to_station).filter(c => c))];
        const filter = document.getElementById('cityFilter');
        
        // تنظيف القائمة وإضافة المدن الموجودة فعلياً
        filter.innerHTML = '<option value="all">All Stations</option>';
        uniqueCities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = opt.text = city;
            filter.add(opt);
        });

        updateView();
    }

    function updateView() {
        const selectedCity = document.getElementById('cityFilter').value;
        const cityCounts = {};
        let totalRevenue = 0;
        let bookingCount = 0;

        globalData.forEach(item => {
            const city = item.to_station;
            if (!city) return; // تجاهل القيم الفارغة

            const bookings = item.Booking || [];
            
            if (selectedCity === 'all' || city === selectedCity) {
                bookingCount += bookings.length;
                
                // تحديث عداد المدن للرسم البياني
                cityCounts[city] = (cityCounts[city] || 0) + bookings.length;
                
                bookings.forEach(b => {
                    totalRevenue += (Number(b.ticket_price) || 0);
                });
            }
        });

        document.getElementById('totalBookings').innerText = bookingCount;
        document.getElementById('totalRev').innerText = totalRevenue + " SAR";

        renderChart(cityCounts);
    }

    function renderChart(cityData) {
        const ctx = document.getElementById('tripsChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(cityData), // أسماء المدن من الداتابيز
                datasets: [{
                    label: 'Number of Passengers',
                    data: Object.values(cityData),
                    backgroundColor: '#8e44ad',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    fetchData();
</script>
</body>
</html>
