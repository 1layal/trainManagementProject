<!DOCTYPE html>
<html>

<head>
    <title>Manage Trains</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --accent: #8e44ad;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-top: 8px solid var(--accent);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
        }

        button.edit {
            background-color: #28a745;
            color: white;
        }

        button.delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="card">
        <h2>Manage Trains</h2>
        <button id="addTrainBtn" class="btn-primary">+ Add New Train</button>
        <div style="overflow-x: auto;">
            <table id="trainsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Number</th>
                        <th>Capacity</th>
                        <th>Available Seats</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="trainsTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;">Loading trains...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="message" class="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


        // Check login
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'index.html';
        })();

        async function loadTrains() {
            const { data, error } = await supabaseClient.from('trains').select('*');
            if (error) return console.error(error);
            const tbody = document.querySelector('#trainsTable tbody');
            tbody.innerHTML = '';
            data.forEach(train => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = train.id;
                row.insertCell(1).textContent = train.name;
                row.insertCell(2).textContent = train.number;
                row.insertCell(3).textContent = train.capacity;
                row.insertCell(4).textContent = train.available_seats ?? train.capacity;
                const actionsCell = row.insertCell(5);
                // Create Edit button
                const editBtn = document.createElement('button');
                editBtn.textContent = 'Edit';
                editBtn.className = 'edit';
                editBtn.onclick = () => editTrain(train.id);
                // Create Delete button
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Delete';
                delBtn.className = 'delete';
                delBtn.onclick = () => deleteTrain(train.id);
                actionsCell.appendChild(editBtn);
                actionsCell.appendChild(delBtn);
            });
        }

        async function deleteTrain(id) {
            if (!confirm('Delete this train?')) return;
            const { error } = await supabaseClient.from('trains').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadTrains(); // refresh list
        }

        function editTrain(id) {
            window.location.href = `edit_train.html?id=${id}`;
        }
document.getElementById('addTrainBtn').addEventListener('click', () => {
    window.location.href = 'add_train.html';
});
        loadTrains();
    </script>
</body>

</html>
