<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro System - Add Passenger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border-top: 8px solid var(--accent-color);
            box-sizing: border-box;
            text-align: center;
        }

        h2 { color: var(--primary-color); margin-bottom: 25px; text-transform: uppercase; font-size: 1.4rem; }

        .form-group { margin-bottom: 15px; text-align: left; }
        
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; font-size: 14px; }

        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent-color); }

        button { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            background-color: var(--accent-color); 
            color: white; 
            margin-top: 15px;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:disabled { background-color: #ccc; }

        .status-msg { margin-top: 15px; font-size: 14px; display: none; padding: 10px; border-radius: 6px; }
        .success { background: #e6fffa; color: #2c7a7b; border: 1px solid #b2f5ea; }
        .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Add Passenger</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Enter details to add a new passenger to the system</p>
        
        <form id="regForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label>Passenger ID</label>
                <input type="text" id="pID" placeholder="Ex: P-1002" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@email.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx" required>
            </div>

            <button type="submit" id="submitBtn">Register Passenger</button>
        </form>

        <div id="statusArea" class="status-msg"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusArea');
        
        btn.disabled = true;
        btn.innerText = "Registering...";
        status.style.display = "none";

        const passengerData = {
            passenger_id: document.getElementById('pID').value,
            name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value
        };

        try {
           
            const { error } = await _supabase
                .from('passengers')
                .insert([passengerData]);

            if (error) throw error;

            status.className = "status-msg success";
            status.innerHTML = "✅ Passenger registered successfully!";
            status.style.display = "block";
            document.getElementById('regForm').reset();

        } catch (err) {
            status.className = "status-msg error";
            status.innerHTML = "❌ Error: " + err.message;
            status.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.innerText = "Register Passenger";
        }
    });
</script>
</body>
</html>
