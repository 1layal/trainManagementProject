<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro System - Secure Booking</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border-top: 8px solid var(--accent-color);
            box-sizing: border-box;
            text-align: center;
        }

        h2 { color: var(--primary-color); margin-bottom: 25px; text-transform: uppercase; font-size: 1.4rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
            outline: none; box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent-color); }
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; background-color: var(--accent-color); color: white; margin-top: 10px;
            font-size: 16px; transition: 0.3s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.5; }
        .success { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
        .error { background: #fff5f5; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Book Ticket</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label>Passenger ID</label>
                <input type="text" id="pID" placeholder="Enter ID (e.g. P1001)" required>
            </div>

            <div class="form-group">
                <label>Select Available Trip</label>
                <select id="tripSelect" required>
                    <option value="">Fetching trips from system...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ticket Class & Price</label>
                <select id="ticketType" required>
                    <option value="">-- Select Class --</option>
                    <option value="Economy" data-price="50">Economy Class - 50 SAR</option>
                    <option value="Business" data-price="120">Business Class - 120 SAR</option>
                    <option value="First Class" data-price="250">First Class - 250 SAR</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Confirm Booking</button>
        </form>
        <div id="statusArea" class="status"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchTrips() {
        const select = document.getElementById('tripSelect');
        const { data, error } = await _supabase
            .from('schedules')
            .select('id, route_name, departure_time');

        if (error) {
            select.innerHTML = '<option>Error loading trips</option>';
            return;
        }

        select.innerHTML = '<option value="">-- Choose a Trip --</option>';
        data.forEach(t => {
            const time = new Date(t.departure_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = `${t.route_name} | ${time}`;
            select.appendChild(opt);
        });
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusArea');
        
        btn.disabled = true;
        btn.innerText = "Verifying & Booking...";
        status.style.display = "none";

        const pID = document.getElementById('pID').value.trim();
        const sID = document.getElementById('tripSelect').value;
        const typeSelect = document.getElementById('ticketType');
        const tType = typeSelect.value;
        const tPrice = typeSelect.selectedOptions[0].getAttribute('data-price');

        try {
            const { data: pData, error: pError } = await _supabase
                .from('passengers')
                .select('name')
                .eq('passenger_id', pID)
                .single();

            if (pError || !pData) throw new Error("Passenger ID not found.");

            const { data: sData, error: sError } = await _supabase
                .from('schedules')
                .select(`
                    train_id,
                    trains (available_seats)
                `)
                .eq('id', sID)
                .single();

            if (sError || !sData) throw new Error("Trip information missing.");
            
            const availableSeats = sData.trains.available_seats;

            if (availableSeats <= 0) {
                throw new Error("Sorry, no available seats on this train.");
            }

            const { error: bError } = await _supabase
                .from('Booking')
                .insert([{
                    passenger_id: pID,
                    name: pData.name,
                    schedule_id: sID,
                    train_id: sData.train_id,
                    ticket_type: tType,
                    ticket_price: tPrice,
                    booking_date: new Date().toISOString().split('T')[0]
                }]);

            if (bError) throw bError;
           
            const { error: uError } = await _supabase
                .from('trains')
                .update({ available_seats: availableSeats - 1 })
                .eq('id', sData.train_id); 

            if (uError) throw uError;

            status.className = "status success";
            status.innerHTML = `✅ <b>Booking Successful!</b><br>Class: ${tType}<br>Remaining Seats: ${availableSeats - 1}`;
            status.style.display = "block";
            document.getElementById('bookingForm').reset();

        } catch (err) {
            status.className = "status error";
            status.innerHTML = "❌ <b>Failed:</b> " + err.message;
            status.style.display = "block";
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = "Confirm Booking";
        }
    });

    fetchTrips();
</script>
</body>
</html>
