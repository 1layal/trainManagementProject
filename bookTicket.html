<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Train Booking System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border-top: 8px solid var(--accent-color);
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: white;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .status-info {
            background: #f0ebf7;
            padding: 12px;
            border-radius: 8px;
            color: var(--accent-color);
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card"> <h2>Book Train Ticket</h2>
    
    <div id="statusInfo" class="status-info">Select a train to check capacity</div>

    <form id="bookingForm">
        <div class="form-group">
            <label>Passenger Name</label>
            <input type="text" id="passName" required placeholder="Enter Full Name">
        </div>
        <div class="form-group">
            <label>Passenger ID</label>
            <input type="text" id="passID" required placeholder="Enter National ID">
        </div>
        <div class="form-group">
            <label>Select Train</label>
            <select id="trainSelect" onchange="checkCapacity()" required>
                <option value="">-- Choose Train --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Booking Date</label>
            <input type="date" id="bookingDate" required>
        </div>
        
        <button type="submit" id="submitBtn" class="btn-accent">Confirm Booking</button>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchTrains() {
        const { data, error } = await _supabase.from('trains').select('id, name');
        if (error) console.error(error);
        const select = document.getElementById('trainSelect');
        data?.forEach(t => {
            let opt = document.createElement('option');
            opt.value = t.id;
            opt.innerText = t.name;
            select.appendChild(opt);
        });
    }

    async function checkCapacity() {
        const trainId = document.getElementById('trainSelect').value;
        if (!trainId) return;
        const { data } = await _supabase.from('trains').select('capacity').eq('id', trainId).single();
        if (data) {
            document.getElementById('statusInfo').innerText = `Available Capacity: ${data.capacity}`;
            return data.capacity;
        }
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const p_id = document.getElementById('passID').value;
        const p_name = document.getElementById('passName').value;
        const t_id = document.getElementById('trainSelect').value;
        const b_date = document.getElementById('bookingDate').value;

        btn.disabled = true;
        btn.innerText = "Processing...";

        const { data: pCheck } = await _supabase.from('passengers').select('name').eq('passenger_id', p_id).maybeSingle();
        if (!pCheck) {
            alert("Passenger not registered!");
            btn.disabled = false;
            btn.innerText = "Confirm Booking";
            return;
        }

        const currentCap = await checkCapacity();
        if (currentCap <= 0) {
            alert("Train is full!");
            btn.disabled = false;
            btn.innerText = "Confirm Booking";
            return;
        }

        const { error: bookError } = await _supabase.from('Booking').insert([
            { name: p_name, booking_date: b_date }
        ]);

        if (!bookError) {
            await _supabase.from('trains').update({ capacity: currentCap - 1 }).eq('id', t_id);
            alert("Booking Successful!");
            document.getElementById('bookingForm').reset();
            document.getElementById('statusInfo').innerText = "Select a train to check capacity";
        } else {
            alert("Error: " + bookError.message);
        }
        btn.disabled = false;
        btn.innerText = "Confirm Booking";
    });

    fetchTrains();
</script>
</body>
</html>
