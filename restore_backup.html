<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro System - Data Restoration</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border-top: 8px solid var(--accent-color);
            box-sizing: border-box;
            text-align: center;
        }

        h2 { 
            color: var(--primary-color); 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9em; 
            color: #666; 
            margin-bottom: 25px;
        }

        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #444; 
        }

        select, input[type="file"] { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            background: #fff;
        }

        select:focus, input:focus { border-color: var(--accent-color); }

        button { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            transition: all 0.3s ease; 
            background-color: var(--accent-color); 
            color: white; 
            margin-top: 10px;
        }

        button:hover { 
            filter: brightness(1.1); 
            transform: translateY(-2px); 
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            text-align: left;
        }

        .message.error { background: #fdf2f2; color: #e74c3c; border: 1px solid #f5c6cb; display: block; }
        .message.info { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; display: block; }
        .message.success { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>Contingency Plan</h2>
    <p class="subtitle">Restore deleted data using your combined backup file.</p>

    <div class="form-group">
        <label for="tableSelect">Select Table to Restore:</label>
        <select id="tableSelect">
            <option value="trains">Trains</option>
            <option value="passengers">Passengers</option>
            <option value="Booking">Bookings</option>
        </select>
    </div>

    <div class="form-group">
        <label for="csvFile">Choose Backup File:</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <button type="button" onclick="restoreFromBackup()">Restore Data</button>

    <div id="message" class="message"></div>
</div>

<script>
    let dbClient = null;
    try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
            dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    } catch (e) {
        console.error("Supabase initialization error:", e);
    }

    async function restoreFromBackup() {
        const msgDiv = document.getElementById('message');
        msgDiv.style.display = 'block';

        if (!dbClient) {
            msgDiv.className = 'message error';
            msgDiv.innerHTML = 'Error: Supabase failed to load.';
            return;
        }

        msgDiv.className = 'message info';
        msgDiv.innerHTML = 'Processing backup file...';

        const table = document.getElementById('tableSelect').value;
        const fileInput = document.getElementById('csvFile');

        if (!fileInput.files.length) {
            msgDiv.className = 'message error';
            msgDiv.innerHTML = 'Please select a backup file first.';
            return;
        }

        try {
            const file = fileInput.files[0];
            const text = await file.text();
            const allRows = text.split(/\r?\n/);

            let targetTag = '';
            if (table === 'trains') targetTag = '--- TRAINS ---';
            else if (table === 'passengers') targetTag = '--- PASSENGERS ---';
            else if (table === 'Booking' || table === 'bookings') targetTag = '--- BOOKINGS ---';

            let sectionRows = [];
            let capturing = false;

            for (let i = 0; i < allRows.length; i++) {
                const line = allRows[i].trim();
                if (line === targetTag) {
                    capturing = true;
                    continue;
                }
                if (capturing) {
                    if (line.startsWith('--- ') && line.endsWith(' ---')) {
                        break;
                    }
                    if (line !== '') {
                        sectionRows.push(line);
                    }
                }
            }

            if (sectionRows.length === 0 && !text.includes('---')) {
                sectionRows = allRows.filter(r => r.trim() !== '');
            }

            if (sectionRows.length < 2) {
                throw new Error(`No data records found for "${table}" in this backup file.`);
            }

            const headers = sectionRows[0].split(',').map(h => h.trim().replace(/^"|"$/g, '')).filter(h => h !== '');
            const records = [];

            for (let i = 1; i < sectionRows.length; i++) {
                const values = sectionRows[i].split(',').map(v => v.trim().replace(/^"|"$/g, '').replace(/;/g, ','));
                const record = {};
                headers.forEach((header, index) => {
                    record[header] = values[index] !== undefined && values[index] !== '' ? values[index] : null;
                });
                records.push(record);
            }

            if (records.length === 0) {
                throw new Error('No valid records found to insert.');
            }

            const { error } = await dbClient.from(table).upsert(records);

            if (error) throw new Error(error.message);

            msgDiv.className = 'message success';
            msgDiv.innerHTML = `Successfully restored ${records.length} record(s) into "${table}".`;

        } catch (err) {
            console.error(err);
            msgDiv.className = 'message error';
            msgDiv.innerHTML = 'Error: ' + err.message;
        }
    }
</script>
</body>
</html>
