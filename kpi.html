<script>

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function loadKPIs() {
    // Fetch counts
    const { count: trainCount } = await supabaseClient.from('trains').select('*', { count: 'exact', head: true });
    const { count: passengerCount } = await supabaseClient.from('passengers').select('*', { count: 'exact', head: true });
    const { count: bookingCount } = await supabaseClient.from('Booking').select('*', { count: 'exact', head: true });

    // Total revenue
    const { data: bookings } = await supabaseClient.from('Booking').select('total_price');
    const totalRevenue = bookings?.reduce((sum, b) => sum + (b.total_price||0), 0);

    // Occupancy rate: average (booked seats / capacity) across all trains
    const { data: trains } = await supabaseClient.from('trains').select('capacity, available_seats');
    let totalCapacity = 0, totalBooked = 0;
    trains?.forEach(t => {
        totalCapacity += t.capacity;
        totalBooked += (t.capacity - (t.available_seats ?? t.capacity));
    });
    const occupancyRate = totalCapacity ? ((totalBooked / totalCapacity) * 100).toFixed(1) : 0;

    const kpiHtml = `
        <div class="metric-card"><div class="metric-value">${trainCount || 0}</div><div class="metric-label">Total Trains</div></div>
        <div class="metric-card"><div class="metric-value">${passengerCount || 0}</div><div class="metric-label">Total Passengers</div></div>
        <div class="metric-card"><div class="metric-value">${bookingCount || 0}</div><div class="metric-label">Total Bookings</div></div>
        <div class="metric-card"><div class="metric-value">$${totalRevenue.toFixed(2)}</div><div class="metric-label">Revenue</div></div>
        <div class="metric-card"><div class="metric-value">${occupancyRate}%</div><div class="metric-label">Occupancy Rate</div></div>
    `;
    document.getElementById('kpiGrid').innerHTML = kpiHtml;
}
</script>
