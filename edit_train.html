<!DOCTYPE html>
<html>

<head>
    <title>Edit Train</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --accent: #8e44ad;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container,
        .card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-top: 8px solid var(--accent);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-size: 1rem;
        }

        .btn-search,
        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-search:hover,
        .btn-primary:hover {
            background: #1e2b36;
        }

        .btn-accent,
        .btn-save {
            background: var(--accent);
            color: white;
        }

        .btn-accent:hover,
        .btn-save:hover {
            background: #6c3483;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="card">
        <h2>Edit Train</h2>
        <form id="editForm">
            <div class="form-group">
                <label>Train Name</label>
                <input type="text" id="trainName" required>
            </div>
            <div class="form-group">
                <label>Train Number</label>
                <input type="text" id="trainNumber" required>
            </div>
            <div class="form-group">
                <label>Seat Capacity</label>
                <input type="number" id="capacity" required>
            </div>
            <button type="submit" class="btn-accent">Update Train</button>
        </form>
        <div id="message"></div>
        <script>
            const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

           
            const urlParams = new URLSearchParams(window.location.search);
            let trainId = urlParams.get('id');

            console.log('Raw trainId from URL:', trainId); // debug

            if (!trainId) {
                document.getElementById('message').innerHTML = '<span class="error">No train ID provided in URL.</span>';
            } else {
                trainId = Number(trainId);
                if (isNaN(trainId)) {
                    document.getElementById('message').innerHTML = '<span class="error">Invalid train ID (not a number).</span>';
                } else {
                    loadTrainData(trainId);
                }
            }

            async function loadTrainData(id) {
                console.log('Loading train with ID:', id);
                const { data, error } = await supabaseClient
                    .from('trains')
                    .select('*')
                    .eq('id', id)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase error:', error);
                    document.getElementById('message').innerHTML = `<span class="error">Error loading train: ${error.message}</span>`;
                    return;
                }

                if (!data) {
                    document.getElementById('message').innerHTML = `<span class="error">No train found with ID ${id}</span>`;
                    return;
                }

                // Populate form
                document.getElementById('trainName').value = data.name;
                document.getElementById('trainNumber').value = data.number;
                document.getElementById('capacity').value = data.capacity;
            }

            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('trainName').value.trim();
                const number = document.getElementById('trainNumber').value.trim();
                const capacity = parseInt(document.getElementById('capacity').value);

                if (!name || !number || isNaN(capacity) || capacity <= 0) {
                    document.getElementById('message').innerHTML = '<span class="error">All fields required and capacity > 0.</span>';
                    return;
                }

                const { error } = await supabaseClient
                    .from('trains')
                    .update({ name, number, capacity })
                    .eq('id', trainId);

                if (error) {
                    document.getElementById('message').innerHTML = `<span class="error">Update failed: ${error.message}</span>`;
                } else {
                    document.getElementById('message').innerHTML = '<span class="success">Train updated successfully! Redirecting...</span>';
                    setTimeout(() => {
                        window.location.href = 'manage_trains.html';
                    }, 1500);
                }
            });
        </script>
</body>

</html>
