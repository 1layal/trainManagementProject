<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Reservation</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --danger-color: #e74c3c;
            --bg-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border-top: 8px solid var(--danger-color); /* أحمر لأنه حذف */
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-info {
            background: #fdf2f2;
            padding: 12px;
            border-radius: 8px;
            color: var(--danger-color);
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--danger-color); }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }

        button:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* منطقة النتيجة */
        .result-area {
            margin-top: 25px;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: none;
            text-align: left;
            background: #fafafa;
        }

        .result-area h4 { margin-top: 0; color: var(--primary-color); }
        .result-area p { font-size: 14px; color: #666; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h2>Delete Reservation</h2>
    
    <div class="form-group">
        <label>Booking ID (Database Reference)</label>
        <input type="number" id="searchInput" placeholder="Enter Booking ID">
        <button class="btn-primary" onclick="searchReservation()">Search Booking</button>
    </div>

    <div id="resultArea" class="result-area">
        <h4>Booking Found:</h4>
        <p id="reservationDetail"></p>
        <button class="btn-danger" id="deleteBtn">Cancel This Reservation</button>
    </div>

    <p id="errorMsg" style="color: var(--danger-color); display: none; text-align: center; margin-top: 15px;">
        No reservation found with this ID.
    </p>
</div>

<script>
    const SUPABASE_URL = 'https://llodsshgdscjtlwdajgs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsb2Rzc2hnZHNjanRsd2RhamdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDc2MDksImV4cCI6MjA5MDc4MzYwOX0.Fytw-auxCmWABCEDCwPjuAGEoWvk88abfpXoOtnFcJs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentBooking = null;

    async function searchReservation() {
        const id = document.getElementById('searchInput').value;
        const resultArea = document.getElementById('resultArea');
        const errorMsg = document.getElementById('errorMsg');
        const detailPara = document.getElementById('reservationDetail');

        if(!id) return;

        // البحث في جدول Booking (تأكدي من اسم الجدول عندك)
        const { data, error } = await _supabase
            .from('Booking')
            .select('*')
            .eq('id_booking', id)
            .maybeSingle();

        if (data) {
            currentBooking = data;
            errorMsg.style.display = 'none';
            resultArea.style.display = 'block';
            detailPara.innerHTML = `
                <strong>Passenger:</strong> ${data.name}<br>
                <strong>Date:</strong> ${data.booking_date}<br>
                <strong>Train ID:</strong> ${data.train_id || 'Not Assigned'}
            `;
            
            document.getElementById('deleteBtn').onclick = () => confirmDeletion(data);
        } else {
            resultArea.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }

    async function confirmDeletion(booking) {
        if (confirm("Are you sure you want to cancel this reservation? This will return 1 seat to the train capacity.")) {
            
            const deleteBtn = document.getElementById('deleteBtn');
            deleteBtn.disabled = true;
            deleteBtn.innerText = "Deleting...";

            // 1. حذف الحجز
            const { error: deleteError } = await _supabase
                .from('Booking')
                .delete()
                .eq('id_booking', booking.id_booking);

            if (!deleteError) {
                // 2. زيادة السعة في جدول القطارات (إذا كان الحجز مرتبط بقطار)
                if (booking.train_id) {
                    const { data: trainData } = await _supabase
                        .from('trains')
                        .select('capacity')
                        .eq('id', booking.train_id)
                        .single();

                    if (trainData) {
                        await _supabase
                            .from('trains')
                            .update({ capacity: trainData.capacity + 1 })
                            .eq('id', booking.train_id);
                    }
                }
                
                alert("Reservation cancelled successfully.");
                location.reload();
            } else {
                alert("Error: " + deleteError.message);
                deleteBtn.disabled = false;
                deleteBtn.innerText = "Cancel This Reservation";
            }
        }
    }
</script>

</body>
</html>
